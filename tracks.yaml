# The playlist. Add a track: copy a block, edit it, commit. That's it.
# Order here is playing order — the top of the file plays first going forward.
#
# url is the only thing that must be exactly right. title/artist can be fixed
# later. YouTube, SoundCloud (share links are fine — the build expands them) and
# Bandcamp are the three that work.
#
# - url: https://www.youtube.com/watch?v=...
#   title: Title
#   artist: Artist
#   year: 1989           # optional
#   duration: 3390       # optional, seconds — makes the clock estimate on Bandcamp
#   start: 0             # optional, seconds — start here (YouTube/SoundCloud only)
#   note: anything       # optional, not shown

