# tracks.yaml is edited in the browser as often as in an editor, so a push has
# to be the whole deploy. Before this existed the only thing that shipped the
# site was `npm run deploy` from a laptop, and an edit committed from a phone
# just sat in main looking deployed.
name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# A run is a deploy, so let a newer commit win rather than racing an older one
# to Cloudflare. In-progress runs finish (no cancel-in-progress): a half-killed
# `wrangler pages deploy` is worse than one wasted minute.
concurrency:
  group: deploy
permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    # resolve.ts fetches every Bandcamp page; the default 6h would let a hung
    # build sit there all day.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # The forty mirrored clocks.dev faces are third-party components nobody
      # here can check by eye. This proves each one still mounts, redraws when
      # the time changes, and unmounts — before any of it reaches the site.
      - run: npm test
      # Build and deploy in one step, on purpose: `npm run deploy` is the same
      # command a laptop runs, so there is one definition of what shipping is.
      # A schema error in tracks.yaml fails here and nothing is published —
      # Cloudflare keeps serving the last good deploy.
      - run: npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
